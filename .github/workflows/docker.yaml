name: Build & Push CUDA Image (GHCR)

on:
  push:
    # Version tags are the intentional release boundary for container images.
    tags: ["v*"]
    # The v2 integration branch republishes the MUTABLE :v2-dev tag on every
    # commit, so downstream pipelines can track fixes by re-pulling one stable
    # name instead of editing a pinned sha into their config per attempt.
    branches: ["feature/cortado-successor"]
  # Build and smoke-test (never push) on any PR that can change what lands in
  # the image. A broken image previously shipped because nothing exercised it
  # until after the release tag was cut.
  pull_request:
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/docker.yaml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # :v2-dev is a MOVING pointer at the current v2 integration build --
          # every push to the branch overwrites it. :sha-<commit> is published
          # alongside it and is immutable, so once a build is known good the
          # pipeline can pin that instead of tracking the moving tag.
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=v2-dev,enable=${{ github.event_name != 'pull_request' }}

      # Build into the local daemon FIRST so the image can be exercised before
      # anything is published. The push step below is a cache hit on this build.
      - name: Build JAX CUDA image (local, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: perturbo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The dependencies live in the image's system prefix, with no venv to
      # activate -- see the Dockerfile for why every venv layout broke under
      # Singularity/Nextflow. These checks pin that property down. CPU-only;
      # nothing here needs a GPU.
      - name: Smoke test — perturbo is importable from a bare PATH
        run: |
          set -euxo pipefail
          # Default CMD is ["perturbo", "--help"].
          docker run --rm perturbo:ci
          docker run --rm perturbo:ci perturbo --help
          # How the pipeline's bin/*.py scripts (`#!/usr/bin/env python`) enter
          # Python. A venv symlink or wrapper at /usr/local/bin/python breaks
          # exactly this while leaving `perturbo` itself working.
          docker run --rm perturbo:ci /usr/bin/env python  -c 'import perturbo'
          docker run --rm perturbo:ci /usr/bin/env python3 -c 'import perturbo'
          # ...and with PATH reduced to the bare minimum, as Singularity may hand it over.
          docker run --rm --env PATH=/usr/local/bin:/usr/bin:/bin perturbo:ci \
            /usr/bin/env python -c 'import perturbo, sys; print(sys.executable, sys.prefix)'
          # A shebanged script is the case a shell wrapper would break with ENOEXEC.
          docker run --rm perturbo:ci sh -c \
            'printf "#!/usr/bin/env python\nimport perturbo\nprint(\"shebang ok\")\n" > /tmp/t.py && chmod +x /tmp/t.py && /tmp/t.py'

      - name: Push JAX CUDA image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
