name: Check build

on:
  workflow_dispatch:
  push:
    branches: [main, v2-port]
  pull_request:
    branches: [main, v2-port]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv run --with "twine>=7" twine check --strict dist/*
      - run: uv venv /tmp/perturbo-wheel
      - run: uv pip install --python /tmp/perturbo-wheel/bin/python dist/*.whl
      - run: /tmp/perturbo-wheel/bin/perturbo --help
      - name: Run tutorials and build docs using the installed wheel
        env:
          JAX_PLATFORM_NAME: cpu
          MPLBACKEND: Agg
        run: |
          wheel=(dist/*.whl)
          uv pip install --python /tmp/perturbo-wheel/bin/python "${wheel[0]}[docs]"
          export PATH="/tmp/perturbo-wheel/bin:$PATH"
          jupyter execute --inplace --timeout=600 docs/tutorials/gasperini.ipynb docs/tutorials/replogle.ipynb
          python - <<'PY'
          import json
          from pathlib import Path
          import mudata
          from perturbo import PerTurboModel
          for screen in ("gasperini", "replogle"):
              notebook = json.loads(Path(f"docs/tutorials/{screen}.ipynb").read_text())
              outputs = [out for cell in notebook["cells"] for out in cell.get("outputs", [])]
              assert any("image/png" in out.get("data", {}) for out in outputs), screen
              fitted = Path(f"docs/tutorials/runs/{screen}/fitted.h5mu")
              model = PerTurboModel.load(fitted)
              assert model.gene_names
              effects = mudata.read_h5mu(fitted).uns["_perturbo"]["effects"]
              assert effects["q_global"].between(0, 1).any(), screen
          PY
          sphinx-build -W --keep-going -b html docs docs/_build/html
