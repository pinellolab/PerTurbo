name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      JAX_PLATFORM_NAME: cpu
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group test
      - run: uv run pytest

  clean-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv venv /tmp/perturbo-base
      - run: uv pip install --python /tmp/perturbo-base/bin/python .
      - run: >-
          /tmp/perturbo-base/bin/python -c
          "import sys; import perturbo;
          assert all(name not in sys.modules for name in ('torch', 'pyro', 'scvi'))"

  legacy:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORM_NAME: cpu
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group test --extra legacy
      - run: uv run pytest tests/legacy
