[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "perturbo"
version = "2.0.0rc2"
description = "Bayesian Perturb-seq analysis with NumPyro and JAX."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Logan Blaine" }]
maintainers = [{ name = "Logan Blaine", email = "loganblaine@g.harvard.edu" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anndata>=0.12.13",
    "hdf5plugin>=6.0.0",
    "jax>=0.8.0",
    "matplotlib>=3.8",
    "mudata>=0.3.2",
    "numpy>=2.0",
    "numpyro>=0.20.1",
    "pandas>=2.3.3",
    "pyarrow>=15.0.0",
    "scipy>=1.11.4",
    "tqdm>=4.66.0",
]

[project.scripts]
perturbo = "perturbo.cli:main"

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.8.0"]
legacy = [
    "pyro-ppl>=1.8.6",
    "scikit-learn>=1.0",
    "scvi-tools>=1.4,<1.5",
    # Lightning used by the historical scvi stack still imports pkg_resources,
    # which was removed from setuptools 81.
    "setuptools>=65,<81",
    "statsmodels>=0.14",
    "torch>=1.11.0",
]
docs = [
    "docutils>=0.8,!=0.18.*,!=0.19.*",
    "ipykernel",
    "ipython",
    "myst-nb>=1.1",
    "setuptools",
    "sphinx>=4",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme>=1",
    "sphinx-copybutton",
    "sphinx-tabs",
    "sphinxcontrib-bibtex>=1",
    "sphinxext-opengraph",
]

[project.urls]
Documentation = "https://PerTurbo.readthedocs.io/"
Homepage = "https://github.com/pinellolab/PerTurbo"
Source = "https://github.com/pinellolab/PerTurbo"

[dependency-groups]
test = [
    "coverage[toml]>=7.6",
    "pytest>=8.3",
]
dev = [
    "build>=1.2",
    "pre-commit>=4.0",
    "ruff>=0.8",
    "twine>=6.0",
]

[tool.uv]
package = true

[tool.ruff]
src = ["src"]
line-length = 120
extend-exclude = ["src/perturbo/legacy", "tests/legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/legacy"]
xfail_strict = true
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
source = ["perturbo"]
omit = ["**/test_*.py"]
