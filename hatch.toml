[envs.default]
dependencies = [
    "perturbvi[test]",
]

[envs.default.scripts]
test = "pytest {args:tests}"

[envs.dev]
dependencies = [
    "perturbvi[test]",
    # For notebooks
    "ipykernel",
    "ipython",
    "seaborn",
    "scanpy",
    "matplotlib",
    "graphviz",
    # For VSCode
    "black",
    "ruff"
]

[[envs.all.matrix]]
python = ["3.8", "3.10"]
